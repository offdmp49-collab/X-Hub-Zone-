<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ভাইরাল ভিডিও কালেকশন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09061a;--ink:#f3eeff;--mut:#9a8fc4;--rim:linear-gradient(90deg,#ff0080,#ff8c00,#ffe600,#00ff9d,#00cfff,#8a2be2,#ff0080)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(60% 40% at 15% 0,#2a0f55 0,transparent 70%),radial-gradient(50% 40% at 90% 10%,#04334a 0,transparent 70%),var(--bg);padding:14px 14px 90px}
@keyframes flow{to{background-position:300% 0}}
.neon{position:relative;padding:3px;border-radius:18px;background:var(--rim);background-size:300% 100%;animation:flow 3s linear infinite}
.neon::before{content:"";position:absolute;inset:0;border-radius:18px;background:inherit;filter:blur(14px);opacity:.8;z-index:-1;animation:inherit}
.neon>.in{border-radius:15px;background:#120b2b;overflow:hidden}
.bar{max-width:1100px;margin:0 auto 22px;position:sticky;top:8px;z-index:5}
.bar .in{padding:11px 0;white-space:nowrap}
@keyframes mq{to{transform:translateX(-100%)}}
.mq{display:inline-block;padding-left:100%;animation:mq 16s linear infinite}
.tx{font-weight:700;font-size:clamp(17px,3.4vw,24px);background:var(--rim);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 3s linear infinite}
.srch{max-width:1100px;margin:0 auto 20px}.srch input{width:100%;padding:12px 18px;border-radius:30px;border:1px solid #4a3a90;background:#120b2b;color:#fff;font:inherit}
.bd{position:absolute;top:8px;left:8px;background:#ffe600;color:#222;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;z-index:2;animation:blink 1s infinite alternate}
@keyframes blink{to{background:#ff0a78;color:#fff}}
.more{text-align:center;margin:26px 0}.more button{padding:12px 30px;border:0;border-radius:30px;font:inherit;font-weight:700;background:#ff0a78;color:#fff;cursor:pointer;box-shadow:0 0 18px #ff0a78aa}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 20%,#8ff8,transparent),radial-gradient(2px 2px at 40% 80%,#f8f8,transparent),radial-gradient(2px 2px at 85% 65%,#ff88,transparent);animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
.card{cursor:pointer;-webkit-tap-highlight-color:transparent}
.th{position:relative;aspect-ratio:16/9;background:#000 center/cover no-repeat}
.play{position:absolute;inset:0;margin:auto;width:62px;height:62px;border-radius:50%;background:rgba(255,0,100,.9);display:grid;place-items:center;box-shadow:0 0 0 0 rgba(255,0,100,.7);animation:pulse 1.8s infinite}
.play::after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(255,0,100,0)}100%{box-shadow:0 0 0 0 rgba(255,0,100,0)}}
.ttl{padding:13px 13px 4px;font-weight:700;font-size:18px;line-height:1.4;animation:gt 3s linear infinite}
.hint{color:var(--mut);font-size:13px;padding:0 13px 11px}
#tabs{max-width:1100px;margin:0 auto 22px;display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
#tabs a,#dr a{flex:none;padding:9px 18px;border-radius:30px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;cursor:pointer}
section{max-width:1100px;margin:0 auto 40px;scroll-margin-top:90px}
.sh{margin:0 0 16px;font-size:clamp(20px,4vw,28px)}
.sh .tx{font-size:inherit;filter:drop-shadow(0 0 8px #ff0a78)}
.tx{filter:drop-shadow(0 0 6px #ff0a78aa)}
@keyframes flow2{to{background-position:0 0,300% 0}}
@keyframes gt{0%{text-shadow:0 0 8px #ff0080}25%{text-shadow:0 0 8px #ffe600}50%{text-shadow:0 0 8px #00ff9d}75%{text-shadow:0 0 8px #00cfff}100%{text-shadow:0 0 8px #ff0080}}
.hd{max-width:1100px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid #ffffff14}
.lg{display:flex;align-items:center;gap:10px;min-width:0}.lg .tx{font-size:clamp(18px,4.6vw,26px)}
.lgo{flex:none;width:46px;height:46px;border-radius:13px;background:var(--rim);background-size:300% 100%;animation:flow 3s linear infinite;display:grid;place-items:center;box-shadow:0 0 14px #ff0a7899}
.lgo::after{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.ib{display:flex;gap:8px;flex:none}.ib button{width:46px;height:46px;border-radius:50%;border:1px solid #ffffff22;background:#150d33;color:#fff;font-size:18px;cursor:pointer;animation:gt 3s linear infinite}
.srch{display:none}.srch.on{display:block}
#dr{display:none;max-width:1100px;margin:0 auto 18px;flex-direction:column;gap:8px}#dr.on{display:flex}
#dr a,#tabs a{border:3px solid transparent;background:linear-gradient(#150d33,#150d33) padding-box,var(--rim) border-box;background-size:100% 100%,300% 100%;animation:flow2 3s linear infinite,gt 3s linear infinite}
.stats{margin:6px 13px 13px;padding:10px 14px;border-radius:12px;background:#0d0820;display:flex;justify-content:space-between;color:#52ffc8;font-size:15px;font-weight:700}.stats a{color:#ffd54a;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:60px 10px}
.tg span{animation:gt 2s linear infinite}
.tg{position:fixed;right:16px;bottom:16px;z-index:9;display:flex;align-items:center;gap:10px;padding:11px 18px 11px 12px;border-radius:40px;background:#1d9bf0;color:#fff;text-decoration:none;font-weight:700;animation:glow 1.6s ease-in-out infinite alternate}
.tg svg{width:34px;height:34px;animation:fly 2.2s ease-in-out infinite}
@keyframes glow{from{box-shadow:0 0 8px #1d9bf0,0 0 0 0 #1d9bf066}to{box-shadow:0 0 26px #00e5ff,0 0 0 10px #1d9bf000}}
@keyframes fly{50%{transform:translate(3px,-3px) rotate(-8deg)}}
#dl{display:none;margin:12px auto 0;padding:11px 26px;border:0;border-radius:30px;background:#00c46a;color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 0 16px #00c46a99}
#ch{position:fixed;left:14px;bottom:16px;z-index:9;width:min(300px,calc(100% - 100px));display:none}#ch.on{display:block}
#ch .in{display:flex;gap:10px;padding:12px;align-items:center;position:relative}
#ch img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:#000}
#ch b{display:block;font-size:16px;animation:gt 3s linear infinite}#ch p{font-size:14px;margin:2px 0 6px;color:#d9d2f5}
#ch a{display:inline-block;padding:6px 14px;border-radius:20px;background:#ff0a78;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
#chx{position:absolute;top:2px;right:8px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#md{position:fixed;inset:0;background:#000d;z-index:20;display:none;align-items:center;justify-content:center;padding:14px}
#md.on{display:flex;flex-direction:column}
#md .box{width:min(960px,100%)}
#md .v{aspect-ratio:16/9;width:100%;background:#000}
#md iframe{width:100%;height:100%;border:0;display:block}
#x{position:absolute;top:10px;right:14px;font-size:34px;color:#fff;background:none;border:0;cursor:pointer}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#ffe600;color:#222;font-weight:700;padding:10px 18px;border-radius:30px;z-index:30;display:none}
</style>
</head>
<body>
<header class="hd"><div class="lg"><span class="lgo"></span><span class="tx" id="sn">ভাইরাল ভিডিও কালেকশন</span></div><div class="ib"><button id="sb" aria-label="সার্চ">🔍</button><button id="mn" aria-label="মেনু">☰</button></div></header>
<div class="bar neon"><div class="in"><span class="mq"><span class="tx" id="mq">নতুন নতুন ভাইরাল ভিডিওর কালেকশন দেখুন</span></span></div></div>
<div class="srch"><input id="q" placeholder="🔍 ভিডিও খুঁজুন..."></div>
<nav id="dr"></nav>
<nav id="tabs"></nav>
<div id="g"><div class="empty">লোড হচ্ছে...</div></div>
<a class="tg" id="tg" href="#" target="_blank" rel="noopener" style="display:none">
<svg viewBox="0 0 24 24" fill="#fff"><path d="M9.8 15.3l-.4 4.2c.6 0 .9-.3 1.2-.6l2.9-2.7 6 4.4c1.1.6 1.9.3 2.2-1l3.9-18.4c.4-1.6-.6-2.3-1.7-1.9L1.2 9.4c-1.5.6-1.5 1.5-.3 1.9l5.9 1.8L20.5 5c.6-.4 1.2-.2.7.2z"/></svg>
<span id="tgl">টেলিগ্রামে জয়েন করুন</span></a>
<div id="md"><button id="x" aria-label="বন্ধ">×</button><div class="box neon"><div class="in"><div class="v" id="v"></div></div></div><div style="text-align:center" id="dlw"></div></div>
<button id="dl">⬇ ডাউনলোড</button>
<div id="ch" class="neon"><div class="in"><button id="chx" aria-label="বন্ধ">×</button><img id="chi" alt=""><div><b id="chn"></b><p id="chm"></p><a id="chl" target="_blank" rel="noopener">চ্যাট করুন</a></div></div></div>
<div id="toast"></div>
<script>
const DB="https://x-hub-zone-e3776-default-rtdb.asia-southeast1.firebasedatabase.app"; // Firebase Realtime Database URL
const SITE="site1"; // unique per site: posts stay isolated to this site
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function embedSrc(s){s=(s||"").trim();const m=s.match(/<iframe[^>]+src=["']([^"']+)/i);if(m)s=m[1];
const y=s.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);if(y)return"https://www.youtube.com/embed/"+y[1]+"?autoplay=1";
return s.startsWith("//")?"https:"+s:s}
let vids=[],S={},A2={};
const fixU=u=>{u=(u||"").trim();if(!u)return"";if(u.startsWith("//"))return"https:"+u;return/^[a-z][a-z0-9+.-]*:/i.test(u)?u:"https://"+u};
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2600)}
async function init(){
 const [v,s]=await Promise.all([fetch(`${DB}/sites/${SITE}/videos.json`).then(r=>r.json()).catch(()=>null),fetch(`${DB}/sites/${SITE}/settings.json`).then(r=>r.json()).catch(()=>null)]);
 S=s||{};
 vids=Object.entries(v||{}).map(([id,o])=>({id,...o})).sort((a,b)=>(b.ts||0)-(a.ts||0));
 if(S.siteName){document.getElementById("sn").textContent=S.siteName;document.title=S.siteName}
 if(S.marquee)document.getElementById("mq").textContent=S.marquee;
 if(S.telegram){const t=document.getElementById("tg");t.href=fixU(S.telegram);t.style.display="flex";if(S.tgLabel)document.getElementById("tgl").textContent=S.tgLabel}
 const sc=await fetch(`${DB}/sites/${SITE}/sections.json`).then(r=>r.json()).catch(()=>null);
 SEC=sc?Object.entries(sc).map(([id,o])=>({id,...o})).sort((a,b)=>(a.order||0)-(b.order||0)):DEF.map(([id,name])=>({id,name}));
 const [a2,ch]=await Promise.all([fetch(`${DB}/sites/${SITE}/ads2.json`).then(r=>r.json()).catch(()=>null),fetch(`${DB}/sites/${SITE}/chat.json`).then(r=>r.json()).catch(()=>null)]);
 A2=a2||{};[A2.monS,A2.adsS].forEach(u=>{u=(u||"").trim();if(/^(https:)?\/\//.test(u)){const e=document.createElement("script");e.src=u.startsWith("//")?"https:"+u:u;e.async=true;document.head.appendChild(e)}});
 if(ch&&ch.link&&!sessionStorage.chx){document.getElementById("chn").textContent=ch.name||"";document.getElementById("chm").textContent=ch.msg||"";document.getElementById("chl").href=fixU(ch.link);const im=document.getElementById("chi");if(ch.img)im.src=ch.img;else im.style.display="none";setTimeout(()=>document.getElementById("ch").classList.add("on"),4000)}
 render();
}
const DEF=[["new","নতুন ভিডিও"],["viral","ভাইরাল ভিডিও"],["trend","ট্রেন্ডিং ভিডিও"],["village","গ্রামের ভিডিও"],["tiktok","টিকটকারদের ভিডিও"],["comedy","কমেডি ভিডিও"],["music","নাচ-গানের ভিডিও"],["sports","খেলাধুলার ভিডিও"],["news","নিউজ ভিডিও"]];
let SEC=[],lim={};
const card=o=>`<div class="neon card" data-id="${o.id}"><div class="in"><div class="th" style="background-image:url('${esc(o.thumb)}')">${Date.now()-(o.ts||0)<172800000?'<span class="bd">নতুন</span>':''}<span class="play"></span></div><div class="ttl">${esc(o.title)}</div><div class="stats"><span>👁 ${o.views||0} বার দেখা হয়েছে</span><a data-share="${o.id}">↗ শেয়ার</a></div></div></div>`;
function render(){
 const q=document.getElementById("q").value.trim().toLowerCase(),g=document.getElementById("g"),ids=SEC.map(x=>x.id);
 const L=vids.filter(o=>(o.title||"").toLowerCase().includes(q));
 const secs=[...SEC,{id:"other",name:"অন্যান্য ভিডিও"}].map(c=>({...c,list:L.filter(o=>c.id==="other"?!ids.includes(o.sec):o.sec===c.id)})).filter(c=>c.list.length);
 if(!secs.length){g.innerHTML='<div class="empty">কোনো ভিডিও পাওয়া যায়নি।</div>';document.getElementById("tabs").innerHTML="";return}
 document.getElementById("tabs").innerHTML=document.getElementById("dr").innerHTML=secs.map(c=>`<a data-go="${c.id}">${esc(c.name)}</a>`).join("");
 g.innerHTML=secs.map(c=>{const n=lim[c.id]||6;return `<section id="s_${c.id}"><h2 class="sh"><span class="tx">${esc(c.name)} দেখুন</span></h2><div class="grid">${c.list.slice(0,n).map(card).join("")}</div>${c.list.length>n?`<div class="more"><button data-more="${c.id}">আরও দেখুন</button></div>`:""}</section>`}).join("");
}
document.getElementById("q").oninput=()=>{lim={};render()};
document.addEventListener("click",e=>{const a=e.target.closest("[data-go]");if(a){document.getElementById("dr").classList.remove("on");document.getElementById("s_"+a.dataset.go).scrollIntoView({behavior:"smooth"})}});
document.getElementById("sb").onclick=()=>{const b=document.querySelector(".srch");b.classList.toggle("on");if(b.classList.contains("on"))document.getElementById("q").focus()};
document.getElementById("mn").onclick=()=>document.getElementById("dr").classList.toggle("on");
document.getElementById("g").addEventListener("click",e=>{const b=e.target.closest("[data-more]");if(b){lim[b.dataset.more]=(lim[b.dataset.more]||6)+6;render()}});
const need=()=>Math.max(0,parseInt(S.redirects??4));
const ads=()=>String(S.ads||"").split("\n").map(x=>fixU(x)).filter(Boolean);
document.getElementById("g").addEventListener("click",e=>{
 const sh=e.target.closest("[data-share]");
 if(sh){const o=vids.find(x=>x.id===sh.dataset.share),u=location.href.split("#")[0];if(navigator.share)navigator.share({title:o.title,url:u}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(u);toast("লিংক কপি হয়েছে")}return}
 const c=e.target.closest(".card");if(!c)return;
 const o=vids.find(x=>x.id===c.dataset.id),k="c_"+o.id,n=+sessionStorage.getItem(k)||0,L=ads(),U=fixU(n<3&&[A2.pop,A2.glob,A2.mon][n])||(L.length?L[n%L.length]:"");
 if(n<need()&&U){sessionStorage.setItem(k,n+1);window.open(U,"_blank");toast(`ধাপ ${n+1}/${need()} — ভিডিও দেখতে আবার ক্লিক করুন`);return}
 sessionStorage.removeItem(k);
 document.getElementById("v").innerHTML=`<iframe src="${esc(embedSrc(o.embed))}" allow="autoplay;fullscreen;encrypted-media" allowfullscreen></iframe>`;
 document.getElementById("md").classList.add("on");
 const d=document.getElementById("dl");d._ad=0;d.textContent="⬇ ডাউনলোড";d.dataset.u=o.dl||"";document.getElementById("dlw").appendChild(d);d.style.display=o.dl?"inline-block":"none";
 o.views=(o.views||0)+1;fetch(`${DB}/sites/${SITE}/videos/${o.id}.json`,{method:"PATCH",body:JSON.stringify({views:o.views})}).catch(()=>{});
});
document.getElementById("dl").onclick=e=>{const d=e.currentTarget,u=d.dataset.u;if(A2.dl&&!d._ad){d._ad=1;window.open(fixU(A2.dl),"_blank");d.textContent="⬇ এবার ডাউনলোড করুন";return}window.open(fixU(u),"_blank")};
document.getElementById("chx").onclick=()=>{document.getElementById("ch").classList.remove("on");sessionStorage.chx=1};
function closeM(){document.getElementById("md").classList.remove("on");document.getElementById("v").innerHTML="";document.getElementById("dl").style.display="none"}
document.getElementById("x").onclick=closeM;
document.getElementById("md").addEventListener("click",e=>{if(e.target.id==="md")closeM()});
init();
</script>
</body>
</html>
