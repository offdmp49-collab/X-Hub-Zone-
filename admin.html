<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>অ্যাডমিন প্যানেল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#09061a;color:#f3eeff;font-family:'Hind Siliguri',system-ui,sans-serif;padding:16px;max-width:820px;margin:auto}
h2{margin:22px 0 10px;font-size:20px}
.p{background:#161033;border:1px solid #3a2a78;border-radius:14px;padding:16px}
label{display:block;margin:10px 0 4px;color:#b9aee6;font-size:14px}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #4a3a90;background:#0e0828;color:#fff;font:inherit}
textarea{min-height:80px}
button{padding:10px 18px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;background:#ff0a78;color:#fff;margin-top:12px}
button.g{background:#2b2160}button.d{background:#c0162b;margin:0}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #2a2058}
.row img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#000}
.row b{flex:1;word-break:break-word}
#pv{max-width:200px;margin-top:8px;border-radius:8px;display:none}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#00ff9d;color:#012;padding:9px 18px;border-radius:30px;font-weight:700;display:none}
</style>
</head>
<body>
<div id="lock" class="p" style="margin-top:60px"><h2>অ্যাডমিন লগইন</h2><label>পাসওয়ার্ড</label><input id="pw" type="password"><button onclick="login()">প্রবেশ করুন</button></div>
<div id="app" style="display:none">
<h2 id="ft">নতুন ভিডিও যোগ করুন</h2>
<div class="p">
<label>ভিডিওর শিরোনাম</label><input id="t">
<label>থাম্বনেল (লিংক দিন অথবা নিচে ছবি আপলোড করুন)</label><input id="th" placeholder="https://...jpg">
<input id="f" type="file" accept="image/*" style="margin-top:8px"><img id="pv">
<label>ভিডিও এমবেড কোড বা লিংক</label><textarea id="e"></textarea>
<label>ডাউনলোড লিংক</label><input id="dlu" placeholder="https://...">
<button onclick="save()" id="sb">ভিডিও সেভ করুন</button> <button class="g" onclick="reset()">ফর্ম খালি করুন</button>
</div>
<h2>টেলিগ্রাম চ্যানেল/গ্রুপ জয়েন লিংক</h2>
<div class="p"><input id="tg" placeholder="https://t.me/yourchannel"><button onclick="saveTg()">সেভ করুন</button></div>
<h2>💰 অ্যাড সেটিংস</h2>
<div class="p"><label>Popunder এড লিংক</label><input id="a1" placeholder="https://... popunder URL">
<label>ডাউনলোড বাটন লিংক (অ্যাড)</label><input id="a4" placeholder="https://... ডাউনলোড বাটন URL">
<button onclick="saveAds()">💾 সেভ করুন</button></div>
<h2>🔐 পাসওয়ার্ড পরিবর্তন</h2>
<div class="p"><label>বর্তমান পাসওয়ার্ড</label><input id="pc" type="password">
<label>নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="pn" type="password">
<label>নিশ্চিত করুন</label><input id="pr" type="password">
<button onclick="chPass()">পাসওয়ার্ড পরিবর্তন</button></div>
<h2>সব ভিডিও (<span id="cnt">0</span>)</h2><div class="p" id="list"></div>
</div>
<div id="msg"></div>
<script>
const DB="https://x-hub-zone-e3776-default-rtdb.asia-southeast1.firebasedatabase.app"; // same Firebase URL as index.html
const SITE="site1"; // must match index.html
const PASS="admin123"; // used until you change it from the panel
const $=i=>document.getElementById(i),B=`${DB}/sites/${SITE}`;
let V={},edit=null,img="";
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function msg(t){const m=$("msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",2200)}
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function passOk(t){const h=await fetch(B+"/adminHash.json").then(r=>r.json()).catch(()=>null);return h?(await sha(t))===h:t===PASS}
async function login(){if(await passOk($("pw").value)){sessionStorage.adm=1;start()}else msg("ভুল পাসওয়ার্ড")}
$("pw").addEventListener("keydown",e=>e.key==="Enter"&&login());
async function start(){$("lock").style.display="none";$("app").style.display="block";
 const s=await fetch(B+"/settings.json").then(r=>r.json()).catch(()=>null)||{},x=await fetch(B+"/ads2.json").then(r=>r.json()).catch(()=>null)||{};
 $("tg").value=s.telegram||"";$("a1").value=x.pop||"";$("a4").value=x.dl||"";load()}
async function saveTg(){await fetch(B+"/settings.json",{method:"PATCH",body:JSON.stringify({telegram:$("tg").value.trim()})});msg("টেলিগ্রাম লিংক সেভ হয়েছে")}
async function saveAds(){await fetch(B+"/ads2.json",{method:"PUT",body:JSON.stringify({pop:$("a1").value.trim(),dl:$("a4").value.trim()})});msg("অ্যাড সেভ হয়েছে")}
async function chPass(){const n=$("pn").value;
 if(!(await passOk($("pc").value)))return msg("বর্তমান পাসওয়ার্ড ভুল");
 if(n.length<6)return msg("নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে");
 if(n!==$("pr").value)return msg("পাসওয়ার্ড মিলছে না");
 await fetch(B+"/adminHash.json",{method:"PUT",body:JSON.stringify(await sha(n))});["pc","pn","pr"].forEach(i=>$(i).value="");msg("পাসওয়ার্ড বদলেছে")}
async function load(){V=await fetch(B+"/videos.json").then(r=>r.json()).catch(()=>null)||{};
 const a=Object.entries(V).sort((x,y)=>(y[1].ts||0)-(x[1].ts||0));$("cnt").textContent=a.length;
 $("list").innerHTML=a.length?a.map(([id,o])=>`<div class="row"><img src="${esc(o.thumb)}"><b>${esc(o.title)}</b><button class="g" style="margin:0" onclick="ed('${id}')">এডিট</button><button class="d" onclick="del('${id}')">মুছুন</button></div>`).join(""):"কোনো ভিডিও নেই।"}
$("f").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(640,im.width),c=document.createElement("canvas");c.width=w;c.height=im.height*w/im.width;c.getContext("2d").drawImage(im,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.75);$("pv").src=img;$("pv").style.display="block"};im.src=r.result};r.readAsDataURL(f)};
async function save(){const o={title:$("t").value.trim(),thumb:img||$("th").value.trim(),embed:$("e").value.trim(),dl:$("dlu").value.trim()};
 if(!o.title||!o.thumb||!o.embed)return msg("শিরোনাম, থাম্বনেল ও ভিডিও দিন");
 if(edit)await fetch(`${B}/videos/${edit}.json`,{method:"PATCH",body:JSON.stringify(o)});
 else await fetch(B+"/videos.json",{method:"POST",body:JSON.stringify({...o,ts:Date.now()})});
 msg("সেভ হয়েছে");reset();load()}
function reset(){edit=null;img="";["t","th","e","f","dlu"].forEach(i=>$(i).value="");$("pv").style.display="none";$("ft").textContent="নতুন ভিডিও যোগ করুন";$("sb").textContent="ভিডিও সেভ করুন"}
function ed(id){const o=V[id];edit=id;img="";$("t").value=o.title;$("th").value=o.thumb.startsWith("data:")?"":o.thumb;$("e").value=o.embed;$("dlu").value=o.dl||"";if(o.thumb.startsWith("data:")){img=o.thumb;$("pv").src=img;$("pv").style.display="block"}$("ft").textContent="ভিডিও এডিট করুন";$("sb").textContent="পরিবর্তন সেভ করুন";scrollTo(0,0)}
async function del(id){if(!confirm("ভিডিওটি মুছে ফেলবেন?"))return;await fetch(`${B}/videos/${id}.json`,{method:"DELETE"});msg("মুছে ফেলা হয়েছে");load()}
if(sessionStorage.adm)start();
</script>
</body>
</html>
